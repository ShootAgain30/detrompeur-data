<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Détrompeurs Carrefour</title>
<style>
  /* 1. CONFIGURATION VISUELLE */
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;margin:0;padding:0;overflow-x:hidden;font-family:Arial,sans-serif;height:100vh}
  
  /* Le conteneur qui cache ce qui dépasse */
  #viewport { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
  
  /* Le rail qui contient les deux pages l'une à côté de l'autre */
  #master-slider { 
    display: flex; 
    width: 200vw; 
    height: 100%;
    transition: transform 0.3s ease-out; 
  }

  /* Chaque page prend toute la largeur de l'écran */
  .page { width: 100vw; height: 100%; padding: 4vw; flex-shrink: 0; overflow-y: auto; }

  .header{display:flex;align-items:center;justify-content:center;gap:3vw;margin-bottom:5vw;margin-top:2vw}
  .header img{height:8vw;width:auto}
  .title{color:#fff;font-size:5vw;font-weight:bold;letter-spacing:1px;text-transform:uppercase;opacity:.7}
  .panel{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4vw;padding:4vw;margin-bottom:4vw}
  .panel-title{font-size:4vw;font-weight:bold;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:4vw;text-align:center}
  
  /* Style des inputs et résultats */
  .quai-input{width:100%;background:#2e2e2e;border:1px solid #555;border-radius:3vw;padding:3vw;color:#fff;font-size:8vw;text-align:center;outline:none}
  .row{display:flex;justify-content:space-between;gap:2vw;margin-bottom:3vw}
  .col{flex:1;display:flex;flex-direction:column;align-items:center}
  .lbl{color:#888;font-size:3vw;margin-bottom:1vw;text-transform:uppercase}
  .in{width:100%;background:#2e2e2e;border:1px solid #444;border-radius:2vw;padding:2vw;color:#fff;font-size:6vw;text-align:center;outline:none}
  .res{width:100%;margin-top:2vw;background:#111;border-radius:1.5vw;padding:2vw;text-align:center;min-height:12vw;display:flex;align-items:center;justify-content:center}
  .dim{color:#333;font-size:5vw}
  .rok{color:#00ff00;font-size:8vw;font-weight:bold}
  .rko{color:#ff4444;font-size:6vw;font-weight:bold}
  .rlbl{color:#888;font-size:4vw;margin-right:2vw}
</style>
</head>

<script>
/* 2. TES DONNEES (NE PAS TOUCHER) */
const pickingData = [
  ["12","34","56","78","90"],
  ["11","22","33","44","55"]
  // Ajoute ici tes milliers de lignes
];

const quaiData = {
  "101": "A1",
  "102": "B2"
  // Ajoute ici tes codes quai
};

/* 3. LOGIQUE DU SWIPE (POUR CHANGER DE PAGE) */
let startX = 0;
const slider = document.getElementById('master-slider');

document.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
}, {passive: true});

document.addEventListener('touchend', e => {
  let diff = startX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 80) {
    if (diff > 0) slider.style.transform = 'translateX(-100vw)'; // Vers Quai
    else slider.style.transform = 'translateX(0)';                // Vers Picking
  }
}, {passive: true});

/* 4. TES FONCTIONS DE RECHERCHE */
function searchPicking(colIdx){
  const raw = document.getElementById("p" + colIdx).value.trim();
  if(raw.length < 2) { resetPickingResults(); return; }
  const val = raw.padStart(2, "0");
  let foundRow = null;
  for(const row of pickingData){ if(row[colIdx] === val){ foundRow = row; break; } }
  
  if(!foundRow){
    for(let i=0; i<5; i++) document.getElementById("r"+i).innerHTML = '<span class="rko">??</span>';
  } else {
    for(let i=0; i<5; i++){
      document.getElementById("r"+i).innerHTML = (i === colIdx) ? 
        '<span class="rok">' + foundRow[i] + '</span>' : 
        '<span class="rn">' + foundRow[i] + '</span>';
    }
  }
}

function searchQuai(){
  const val = document.getElementById("inputQuai").value.toUpperCase().trim();
  const box = document.getElementById("resultQuai");
  if(!val){ box.innerHTML = '<span class="rn">Saisissez un code</span>'; return; }
  const found = quaiData[val];
  if(found) box.innerHTML = '<span class="rlbl">Travée :</span><span class="rok">' + found + '</span>';
  else box.innerHTML = '<span class="rko">Inconnu</span>';
}

function resetQuai(){
  document.getElementById("inputQuai").value = "";
  document.getElementById("resultQuai").innerHTML = '<span class="rn">Saisissez un code</span>';
}

function clearOtherPicking(activeIdx){
  for(let i=0; i<5; i++){ if(i !== activeIdx) document.getElementById("p" + i).value = ""; }
  resetPickingResults();
}

function resetPickingResults(){
  for(let i=0; i<5; i++) document.getElementById("r" + i).innerHTML = '<span class="dim">—</span>';
}
</script>
